name: software-foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:schemas
      - run: npm run test:firmware
      - run: npm run build
      - run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_json_schemas.py
      - run: python scripts/check_links.py
  esp-idf:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4
      - name: Build safe ESP32-S3 scaffold
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd firmware
          idf.py set-target esp32s3
          idf.py build
  flutter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Flutter SDK
        run: |
          git clone --depth 1 --branch 3.35.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: node scripts/prepare-mobile.mjs
      - name: Generate Android and iOS project shells
        working-directory: apps/mobile
        run: |
          flutter create --platforms=android,ios --project-name retrodrive_mobile --org dev.retrodrive .
          rm -f test/widget_test.dart
          flutter pub get
      - run: flutter test
        working-directory: apps/mobile
      - run: flutter build apk --debug
        working-directory: apps/mobile
